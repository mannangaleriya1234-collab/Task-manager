<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Task Management System</h1>
        <p class="subtitle">Manage your daily tasks easily</p>

        <div class="task-form">
            <h2 id="formTitle">Add New Task</h2>

            <input type="hidden" id="taskId">

            <label>Task Title</label>
            <input type="text" id="title" placeholder="Enter task title">

            <label>Description</label>
            <textarea id="description" placeholder="Enter task description"></textarea>

            <label>Due Date</label>
            <input type="date" id="dueDate">

            <label>Priority</label>
            <select id="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>

            <button id="addBtn" onclick="addTask()">Add Task</button>
            <button id="updateBtn" onclick="updateTask()" style="display: none;">Update Task</button>
            <button id="cancelBtn" onclick="cancelEdit()" style="display: none;">Cancel</button>
        </div>

        <div class="filter-section">
            <input type="text" id="search" placeholder="Search task..." onkeyup="displayTasks()">

            <select id="filterPriority" onchange="displayTasks()">
                <option value="all">All Priorities</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
        </div>

        <div id="taskList"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
